# Codex completion at the current PR head is presence evidence, not approval or
# finding resolution. The lead reviewer remains responsible for merge readiness.
name: Codex review gate
on:
  # Trusted base workflow handles lifecycle events on every base, including stacks.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # Clean reviews update a completion comment instead of submitting a review.
  issue_comment:
    types: [created, edited, deleted]
concurrency:
  group: codex-review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  # Finish explicit check writes instead of orphaning an in-progress head check.
  cancel-in-progress: false
permissions:
  pull-requests: read
  checks: write
jobs:
  # The native job reports evaluator health. Expected absence affects only the
  # explicit codex-review-present check; API or execution failures fail the job.
  evaluate-codex-review:
    name: Evaluate Codex review evidence
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # No checkout, package install, local import, or PR-code execution. Event
      # and API text are data, never interpolated into the executable script.
      - name: Materialize current-head Codex completion
        uses: actions/github-script@v7
        with:
          script: |
            // Trusted lifecycle/comment events route a PR number, never evidence.
            // All decisions use fresh API comments and the API-reported head.
            if (!['pull_request_target', 'issue_comment'].includes(context.eventName)) {
              throw new Error('Unexpected evaluator event');
            }
            if (context.eventName === 'issue_comment' && !context.payload.issue?.pull_request) return;
            const number = context.eventName === 'issue_comment'
              ? context.payload.issue?.number : context.payload.pull_request?.number;
            if (!Number.isSafeInteger(number) || number <= 0) {
              throw new Error('Missing valid pull request identity in event');
            }
            // Repository identity always comes from the base Actions context,
            // never fork URLs or text supplied by the PR.
            const pr = { ...context.repo, pull_number: number };
            const { data: current } = await github.rest.pulls.get(pr);
            const head = current?.head?.sha;
            if (typeof head !== 'string' || !/^[0-9a-f]{40}$/.test(head)) {
              throw new Error('Missing current PR head SHA from GitHub');
            }

            // Only API author.login authenticates Codex; body text cannot grant
            // identity. Both authorized login spellings identify the same bot.
            const authors = new Set(['chatgpt-codex-connector', 'chatgpt-codex-connector[bot]']);
            // One unambiguous marker establishes either a receipt prefix or a
            // structured full-head completion. Never infer identity or completion
            // from prose. Finding flags do not decide approval or resolution.
            function isCompletion(comment) {
              if (!authors.has(comment?.author?.login) || typeof comment.body !== 'string') return false;
              const body = comment.body;
              const markers = [...body.matchAll(/codex-review-(?:receipt|state):/g)];
              if (markers.length !== 1) return false;
              if (/^<!-- codex-review-receipt:v1 -->$/m.test(body)) {
                // Count even malformed duplicate fields: a second declaration
                // must not be silently ignored in favor of a matching first one.
                if ([...body.matchAll(/\*\*Reviewed commit:\*\*/g)].length !== 1) return false;
                const token = body.match(/^\*\*Reviewed commit:\*\* `([0-9a-fA-F]{7,40})`$/m)?.[1];
                return token !== undefined && head.startsWith(token.toLowerCase());
              }
              const record = body.match(/^<!-- codex-review-state:v1 (.+) -->$/m);
              if (!record) return false;
              try {
                const code = JSON.parse(record[1])?.code_review;
                return code?.status === 'completed' && code.commit_sha === head;
              } catch {
                return false;
              }
            }

            // Conversation comments are the sole evidence source. Read every
            // page, even after a match or a valid head change. A changed head
            // makes the snapshot stale (null), not broken; malformed responses or
            // later API/pagination failures must still fail evaluator health.
            async function readComments() {
              const query = `query($owner: String!, $repo: String!, $number: Int!, $after: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    headRefOid
                    comments(first: 100, after: $after) {
                      nodes { author { login } body }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }`;
              const nodes = [];
              const cursors = new Set();
              let after = null;
              let changedHead = false;
              for (;;) {
                const result = await github.graphql(query, { ...context.repo, number, after });
                const pull = result?.repository?.pullRequest;
                const connection = pull?.comments;
                if (typeof pull?.headRefOid !== 'string' || !/^[0-9a-f]{40}$/.test(pull.headRefOid) ||
                    !Array.isArray(connection?.nodes) || typeof connection?.pageInfo?.hasNextPage !== 'boolean') {
                  throw new Error('Incomplete evidence response');
                }
                changedHead ||= pull.headRefOid !== head;
                // A partial/malformed API record is an infrastructure failure,
                // even beside matching evidence. A null author is legitimate for
                // a deleted account and simply cannot authenticate completion.
                if (connection.nodes.some(comment => !comment || typeof comment.body !== 'string' ||
                    (comment.author !== null && typeof comment.author?.login !== 'string'))) {
                  throw new Error('Incomplete comment record from GitHub');
                }
                nodes.push(...connection.nodes);
                if (!connection.pageInfo.hasNextPage) return changedHead ? null : nodes;
                after = connection.pageInfo.endCursor;
                if (typeof after !== 'string' || !after || cursors.has(after)) {
                  throw new Error('Evidence pagination did not advance');
                }
                cursors.add(after);
              }
            }

            // Event SHA can be a default-branch or merge SHA. Create the required
            // check explicitly on the API's PR head before examining evidence;
            // a failed/cancelled evaluation must not publish a successful check.
            const { data: check } = await github.rest.checks.create({
              ...context.repo, name: 'codex-review-present', head_sha: head, status: 'in_progress',
            });
            if (!Number.isSafeInteger(check?.id) || check.id <= 0) {
              throw new Error('Missing created check identity from GitHub');
            }

            // Complete the same head-bound check; its SHA cannot be redirected
            // by later events, comment metadata, or API response text.
            async function finish(conclusion, summary) {
              await github.rest.checks.update({
                ...context.repo, check_run_id: check.id, status: 'completed', conclusion,
                output: { title: 'Codex review completion', summary },
              });
            }

            let found = false;
            try {
              const comments = await readComments();
              if (comments !== null) {
                // A valid synchronize race only invalidates this head's evidence;
                // the lifecycle event evaluates the new head in its own check.
                // Missing/invalid head data is a broken lookup, not a valid race.
                const { data: latest } = await github.rest.pulls.get(pr);
                const latestHead = latest?.head?.sha;
                if (typeof latestHead !== 'string' || !/^[0-9a-f]{40}$/.test(latestHead)) {
                  throw new Error('Missing current PR head SHA from GitHub');
                }
                found = latestHead === head && comments.some(isCompletion);
              }
            } catch (error) {
              await finish('failure', 'Could not verify current-head Codex completion; evaluation failed closed.');
              throw error;
            }
            const summary = found
              ? 'Codex completed a code review at this PR head. Lead review must assess findings and readiness.'
              : 'No completed Codex code review at the current PR head; request one and wait for completion.';
            await finish(found ? 'success' : 'failure', summary);
            // Missing/pending/stale evidence is an expected decision, so the native
            // evaluator succeeds. Exceptions and failed check writes still escape
            // and fail the job; no continue-on-error can hide broken evaluation.
