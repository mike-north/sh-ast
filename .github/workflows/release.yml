name: Release
on:
  push:
    branches: [main]
# Select, version and publish share the registry and the generated Version Packages branch, so
# runs are serialized; a queued publication must finish rather than be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
# No permissions by default; each job grants only its own authority.
permissions: {}
jobs:
  # Decide, without write access or OIDC, whether this main commit needs a Version Packages
  # pull request, a publication, or nothing.
  select-mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce owner-controlled 0.x releases before versioning or publishing
        run: pnpm run check:release
      - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: select-mode
  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      # Write the version commit through the API and create or update its pull request.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Changeset authorship links in the changelog need the commits that introduced them.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce owner-controlled 0.x releases before versioning or publishing
        run: pnpm run check:release
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: pnpm version-packages
  publish:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    # npm's trusted publisher matches this workflow filename and environment name.
    environment: npm-publish
    permissions:
      # Pushing the release tags and creating GitHub Releases requires contents write.
      contents: write
      # Only the publishing job receives OIDC, including its install and build steps.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # npm trusted publishing requires npm >=11.5.1 and Node >=22.14.0.
          node-version: '24.14.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce owner-controlled 0.x releases before versioning or publishing
        run: pnpm run check:release
      - run: pnpm build
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # The action exports CHANGESETS_OUTPUT to this script; `changeset publish` writes what it
          # published there, which is how tags and releases are created for exactly those packages.
          script: pnpm release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          create-github-releases: true
          push-git-tags: true
