name: CI
on:
  push:
    branches: [main]
  # Run the same checks for pull requests against any base branch.
  pull_request:
env:
  # An external workspace or mutable graph must not redirect canonical builds.
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/sh-ast/shim/go.mod
      - run: pnpm install --frozen-lockfile
      - name: Enforce owner-controlled 0.x releases
        run: pnpm run check:release && pnpm run test:release-gate
      - name: Verify exact fork identity and tamper rejection
        run: node tools/verify-go-source.mjs && node --test tools/verify-go-source*.test.mjs
      - run: pnpm build
      # Includes strict TypeScript lint, API report/docs drift, and syncpack lint.
      - run: pnpm check
      - run: pnpm test
      # The shipped binary runs on the engine's own stack, which Go's native test
      # runs do not model; node's default stack size is what a caller gets. The
      # skipped tests start subprocesses, which the js/wasm target cannot do.
      - name: Test the stream codec on the WebAssembly target with the default Node stack
        working-directory: packages/sh-ast/shim
        run: |
          wrapper="$RUNNER_TEMP/go_wasm_default_stack"
          printf '#!/usr/bin/env bash\nexec node "%s/lib/wasm/wasm_exec_node.js" "$@"\n' "$(go env GOROOT)" > "$wrapper"
          chmod +x "$wrapper"
          GOOS=js GOARCH=wasm go test -exec "$wrapper" \
            -skip '^(TestEncodedFieldOrderMatchesShippedSchema|TestOccurrenceCollectionRejectsCycleWithoutBounds|TestStreamingSliceCyclesTerminate)$' \
            ./internal/syntaxwire
