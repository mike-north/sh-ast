name: CI
on:
  push:
    branches: [main]
  # Stacked candidates need the same checks as PRs targeting main.
  pull_request:
env:
  # An external workspace or mutable graph must not redirect canonical builds.
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/sh-ast/shim/go.mod
      - run: pnpm install --frozen-lockfile
      - name: Verify exact fork identity and tamper rejection
        run: node tools/verify-go-source.mjs && node --test tools/verify-go-source*.test.mjs
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
