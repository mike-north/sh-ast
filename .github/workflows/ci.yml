name: CI
on:
  push:
    branches: [main]
  # Stacked candidates need the same checks as PRs targeting main.
  pull_request:
jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the pinned parser backport and tamper rejection
        run: node tools/verify-mvdan-backport.mjs && node --test tools/verify-mvdan-backport.test.mjs
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
