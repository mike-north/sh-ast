name: Schema reproducibility
on:
  push:
    branches: [main]
  # Stacked candidates need the same checks as PRs targeting main.
  pull_request:
env:
  # An external workspace or mutable graph must not redirect canonical builds.
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
jobs:
  regenerate-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/gen-visitor-keys/go.mod
      - run: pnpm install --frozen-lockfile
      - name: Verify the exact fork source for schema and WASM
        run: node tools/verify-go-source.mjs
      - name: Verify schema against independent upstream observations
        run: go -C tools/gen-visitor-keys test ./...
      - name: Regenerate faithful syntax types, constants, and field metadata
        run: pnpm run generate:sh-ast-schema
      - name: Verify regeneration matches the committed artifacts
        run: |
          if ! git diff --exit-code -- packages/sh-ast/generated; then
            echo "::error::packages/sh-ast/generated is out of date. Run 'pnpm run generate:sh-ast-schema' from the repo root and commit the result." >&2
            exit 1
          fi
